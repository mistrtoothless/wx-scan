name: WeatherScan Live Stream

on:
  schedule:
    # Restarts every 5 hours to stay within GitHub's 6-hour execution limit per job
    - cron: '0 */5 * * *'
  workflow_dispatch: # Enables manual start button in GitHub Actions

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install Google Chrome & Audio/Display Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg pulseaudio dbus-x11 wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Launch Virtual Display, Audio Server & Chrome
        run: |
          # Start Virtual Framebuffer
          Xvfb :99 -screen 0 1920x1080x24 2>/dev/null &
          export DISPLAY=:99
          
          # Initialize PulseAudio with a continuous dummy sink clock
          pulseaudio --start --exit-idle-time=-1
          pacmd load-module module-dummy-sink sink_name=vsnk rate=44100 channels=2
          pacmd set-default-sink vsnk
          pacmd set-default-source vsnk.monitor
          
          sleep 2
          
          unset DBUS_SESSION_BUS_ADDRESS
          unset DBUS_SYSTEM_BUS_ADDRESS
          
          # Launch Chrome with WebGL software rendering and forced audio output
          google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-gl=angle \
            --use-angle=swiftshader \
            --enable-unsafe-webgpu \
            --autoplay-policy=no-user-gesture-required \
            --disable-notifications \
            --no-first-run \
            --disable-fre \
            --no-default-browser-check \
            --kiosk \
            --window-size=1920,1080 \
            "https://v2.weatherscan.net/?Pensacola,FL" 2>/dev/null &
            
          sleep 15

      - name: Stream to YouTube via FFmpeg
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          export DISPLAY=:99
          # Runs for 4 hours 55 minutes (17700 seconds) before clean cycle
          timeout 17700s bash -c '
            while true; do
              ffmpeg -f x11grab -video_size 1920x1080 -framerate 30 -i :99.0 \
                -f pulse -i vsnk.monitor \
                -c:v libx264 -preset superfast -tune zerolatency \
                -b:v 4000k -maxrate 4000k -bufsize 8000k \
                -pix_fmt yuv420p -g 60 \
                -c:a aac -b:a 128k -ar 44100 \
                -f flv "rtmp://a.rtmp.youtube.com/live2/'"$YOUTUBE_STREAM_KEY"'"
              sleep 5
            done
          ' || true
